[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "focusledger"
version = "0.1.0"
description = "Local-first personal productivity audit ledger."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
focusledger = "focusledger.cli:main"

[tool.setuptools.packages.find]
include = ["focusledger*"]

[tool.setuptools.package-data]
focusledger = ["db/schema.sql"]
